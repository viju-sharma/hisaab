<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Hisaab">
  <!-- Shirorekha: the headline rule that runs above Devanagari letters, doubling
       as the rule at the top of a ledger. Quietly Indian without being literal. -->
  <rect x="9" y="13" width="46" height="7" rx="3.5" fill="currentColor"/>
  <!-- Three entries hanging from the rule at unequal lengths: one bill, shares
       that differ, one shared total. -->
  <rect x="11.5" y="20" width="9" height="31" rx="4.5" fill="currentColor"/>
  <rect x="27.5" y="20" width="9" height="21" rx="4.5" fill="currentColor"/>
  <rect x="43.5" y="20" width="9" height="27" rx="4.5" fill="currentColor"/>
</svg>
