<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Hisaab">
  <!-- An equals sign whose two bars are not equal: what looks like an even
       split rarely is, and working out the difference is the whole product. -->
  <rect x="14" y="21" width="36" height="9" rx="4.5" fill="currentColor"/>
  <rect x="14" y="34" width="22" height="9" rx="4.5" fill="currentColor"/>
</svg>
